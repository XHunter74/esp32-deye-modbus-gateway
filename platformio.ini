; Deye RS232 <-> TCP Modbus gateway for ESP32
[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32@6.12.0
board = esp32dev
framework = arduino
board_build.partitions = min_spiffs.csv
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_flags =
    -DCORE_DEBUG_LEVEL=0
; FW_VERSION defaults to "dev"; CI sets it via PLATFORMIO_BUILD_FLAGS
lib_deps =
    tzapu/WiFiManager@^2.0.17
